<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZUBIA INDUSTRIES | Premium Marble Solutions</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1f1f1f);
    color:white;
    overflow:hidden;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
}

h1{
    font-size:4rem;
    letter-spacing:5px;
    text-shadow:0 0 20px rgba(255,255,255,0.4);
}

p{
    margin-top:15px;
    color:#cfcfcf;
    font-size:1.2rem;
}

.marble-container{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.marble{
    position:absolute;
    border-radius:50%;
    background:
    radial-gradient(circle at 30% 30%,
    #ffffff,
    #d9d9d9,
    #8a8a8a);
    box-shadow:0 0 30px rgba(255,255,255,.3);
}

.btn{
    margin-top:30px;
    padding:14px 30px;
    background:white;
    color:black;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}
</style>

</head>
<body>

<div class="hero">

    <h1>ZUBIA INDUSTRIES</h1>

    <p>Premium Marble • Granite • Stone Solutions</p>

    <a href="https://wa.me/91+9413926247" class="btn">
        Contact Us
    </a>

    <div class="marble-container" id="marbles"></div>

</div>

<script>

const container = document.getElementById("marbles");

for(let i=0;i<20;i++){

    const marble = document.createElement("div");
    marble.classList.add("marble");

    const size = Math.random()*90+40;

    marble.style.width = size+"px";
    marble.style.height = size+"px";

    marble.style.left = Math.random()*100+"%";
    marble.style.top = Math.random()*100+"%";

    container.appendChild(marble);

    animate(marble);
}

function animate(el){

    let x = parseFloat(el.style.left);
    let y = parseFloat(el.style.top);

    let dx = (Math.random()*0.08)+0.02;
    let dy = (Math.random()*0.08)+0.02;

    function move(){

        x += dx;
        y += dy;

        if(x>100 || x<0) dx*=-1;
        if(y>100 || y<0) dy*=-1;

        el.style.left = x+"%";
        el.style.top = y+"%";

        requestAnimationFrame(move);
    }

    move();
}
</script>

</body>
</html>
